<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">CineFlow iOS project plan</title>
  <desc id="desc">Dark cinematic banner with a native iOS interface motif</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070911"/><stop offset="1" stop-color="#21143E"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8B5CF6"/><stop offset="1" stop-color="#58A6FF"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-width="1" opacity=".035"/></pattern>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#grid)"/>
  <g transform="translate(927 22)">
    <rect x="0" y="0" width="120" height="216" rx="28" fill="#080B13" stroke="#6E59A8" stroke-width="2"/>
    <rect x="11" y="20" width="98" height="166" rx="15" fill="#111827"/>
    <path d="M25 150l23-41 22 22 18-31 12 50z" fill="url(#line)" opacity=".82"/>
    <circle cx="60" cy="76" r="21" fill="#F0F6FC" opacity=".9"/>
    <path d="M55 65l15 11-15 11z" fill="#6D44D4"/>
    <rect x="41" y="199" width="38" height="4" rx="2" fill="#8B949E" opacity=".6"/>
  </g>
  <path d="M720 54h119l28 22 28-22h39" fill="none" stroke="url(#line)" stroke-width="2" opacity=".65"/>
  <circle cx="720" cy="54" r="4" fill="#8B5CF6"><animate attributeName="opacity" values=".3;1;.3" dur="2.6s" repeatCount="indefinite"/></circle>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="54" y="52" fill="#A69CB8" font-size="15" letter-spacing="3">PROJECT BLUEPRINT · NATIVE iOS</text>
    <text x="54" y="126" fill="#F0F6FC" font-size="48" font-weight="700" letter-spacing="2">CINEFLOW</text>
    <text x="57" y="164" fill="#C4B5FD" font-size="20">discover · save · watch legally</text>
    <text x="1048" y="52" fill="#8B5CF6" font-size="15">STATUS / PLANNED</text>
